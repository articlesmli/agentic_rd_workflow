name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up python
      uses: actions/setup-python@v5
      with:
            python-version: '3.11'
            cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest httpx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check .

    - name: Run Unit Tests
      env:
        # Mocking the key or using a placeholder if your tests use a mock LLM provider
        OPENAI_API_KEY: "mock-key-for-testing"
      run: |
        # Run pytest suite (looks for files named test_*.py)
        pytest

  build-and-push:
    name: 🐳 Build & Package
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Downcase Repository Owner for Docker image tag
      run: |
        echo "REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ env.REPO_OWNER }}/agentic-rd-workflow:latest
          ghcr.io/${{ env.REPO_OWNER }}/agentic-rd-workflow:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
